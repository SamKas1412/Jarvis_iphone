#2989ff}.state-speaking .ring{animation-duration:3s}.state{margin-top:28px;font-size:13px;letter-spacing:.24em;font-weight:800;text-align:center}.hint{font-size:12px;color:#8ab3c8;margin-top:10px;text-align:center;line-height:1.6}.controls{display:flex;gap:12px;justify-content:center}.btn{border:1px solid #46c9fa;border-radius:13px;background:#0b3d65;color:#e8faff;font-weight:800;letter-spacing:.07em;padding:16px 23px;font-size:13px;min-width:140px}.btn.stop{background:#142337;border-color:#45617b}.btn:disabled{opacity:.4}.note{font-size:11px;text-align:center;line-height:1.55;color:#6f96af;margin-top:22px}.error{color:#ffc0bd;min-height:38px;text-align:center;font-size:12px;margin-top:12px;line-height:1.5}@keyframes spin{to{transform:rotate(360deg)}}@keyframes breathe{50%{transform:scale(1.09);filter:brightness(1.2)}}@media(prefers-reduced-motion:reduce){.ring,.orb{animation:none!important}}</style></head><body><main class="app" id="app"><header class="top"><div><div class="brand">J.A.R.V.I.S.</div><div class="sub">PERSONAL AI INTERFACE</div></div><div class="live">ELEVENLABS · LIVE</div></header><section class="center"><div class="orb-wrap"><div class="ring"></div><div class="ring"></div><div class="ring"></div><div class="orb"></div></div><div class="state" id="state">STANDBY</div><div class="hint" id="hint">Bereit für dein Gespräch</div></section><div class="controls"><button class="btn" id="start">JARVIS STARTEN</button><button class="btn stop" id="stop" disabled>BEENDEN</button></div><div class="error" id="error" role="alert"></div><div class="note">Mikrofon nur während eines aktiven Gesprächs. Für iPhone: über HTTPS öffnen und „Zum Home-Bildschirm“ wählen.</div></main><script type="module">
import { Conversation } from 'https://cdn.jsdelivr.net/npm/@elevenlabs/client/+esm';
const AGENT_ID='agent_4001m73hgqbbenes57myae444ncx';
const app=document.getElementById('app'),state=document.getElementById('state'),hint=document.getElementById('hint'),error=document.getElementById('error'),start=document.getElementById('start'),stop=document.getElementById('stop');
let session=null,starting=false;
function ui(mode,msg){app.classList.remove('state-listening','state-speaking');if(mode==='listening'||mode==='speaking')app.classList.add('state-'+mode);state.textContent=({idle:'STANDBY',connecting:'VERBINDE …',listening:'JARVIS HÖRT ZU',speaking:'JARVIS SPRICHT'})[mode]||'JARVIS LIVE';hint.textContent=msg||({idle:'Bereit für dein Gespräch',connecting:'Bitte warten …',listening:'Sprich ganz normal mit Jarvis',speaking:'Jarvis antwortet dir'})[mode];start.disabled=starting||!!session;stop.disabled=!starting&&!session;}
start.addEventListener('click',async()=>{if(session||starting)return;error.textContent='';starting=true;ui('connecting');try{if(!window.isSecureContext)throw Error('Bitte über eine HTTPS-Adresse öffnen.');await navigator.mediaDevices.getUserMedia({audio:true});session=await Conversation.startSession({agentId:AGENT_ID,connectionType:'webrtc',onConnect:()=>ui('listening'),onDisconnect:()=>{session=null;starting=false;ui('idle')},onModeChange:(m)=>ui(m.mode==='speaking'?'speaking':'listening'),onError:(e)=>{error.textContent='Verbindungsfehler: '+(e?.message||String(e));}});starting=false;ui('listening');}catch(e){session=null;starting=false;ui('idle');error.textContent='Start fehlgeschlagen: '+(e?.message||String(e))+' Prüfe Mikrofonfreigabe und ob der ElevenLabs-Agent öffentlich erreichbar ist.';}});
stop.addEventListener('click',async()=>{if(session){const s=session;session=null;try{await s.endSession()}catch(e){error.textContent=String(e)} }starting=false;ui('idle')});
window.addEventListener('pagehide',()=>{session?.endSession().catch(()=>{})});
if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
